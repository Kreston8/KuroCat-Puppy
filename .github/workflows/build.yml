name: Build KuroCat Puppy (Windows x64)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build standalone KuroCat.exe
        shell: cmd
        run: |
          cd windows
          call build.bat
          dir KuroCat.exe

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Puppy-Windows-x64
          path: windows/KuroCat.exe

  release:
    needs: [ build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/KuroCat.exe
